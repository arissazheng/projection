<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Window</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="calib-grid"></canvas>
  </div>
  <div id="msg"></div>

  <div id="panel">
    <h1>Room Window</h1>
    <div class="row"><label for="scene">Scene</label>
      <select id="scene"></select></div>
    <div class="btns">
      <button id="mode-mouse" data-mode="mouse">Mouse</button>
      <button id="mode-webcam" data-mode="webcam">Head</button>
      <button id="mode-gesture" data-mode="gesture">Gestures</button>
      <button id="calib">Calibrate</button>
    </div>
    <div id="gesture-help" hidden></div>
    <div class="btns layers">
      <button data-layers="both">Both layers</button>
      <button data-layers="fg">Foreground</button>
      <button data-layers="bg">Background</button>
    </div>
    <div id="sliders"></div>
    <div class="keys">
      <kbd>H</kbd> hide UI · <kbd>M</kbd> mouse → head → gestures · <kbd>C</kbd> calibrate · <kbd>F</kbd> fullscreen ·
      <kbd>0</kbd> eye to reference · scroll = eye distance (mouse mode) · <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> layers ·
      calibrate: drag corners, arrows nudge, <kbd>R</kbd> reset
    </div>
  </div>
  <div id="hud"></div>
  <video id="webcam-preview" playsinline muted hidden></video>

  <script type="module" src="js/main.js"></script>
</body>
</html>
